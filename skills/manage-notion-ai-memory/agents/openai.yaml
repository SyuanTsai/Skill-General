interface:
  display_name: "Manage Notion AI Memory"
  short_description: "Recall and capture durable Notion memory"
  default_prompt: "Use $manage-notion-ai-memory to recall or capture reusable Notion memory."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Dedicated Notion workspace access for durable cross-task memory"

policy:
  allow_implicit_invocation: true
