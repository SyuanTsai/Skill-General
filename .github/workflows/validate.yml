name: Standard v1 Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-validation:
    name: Skill-General Standard v1
    outputs:
      source_conformance: ${{ steps.source-conformance.outputs.status }}
    # Keep the pinned checkout action as a YAML scalar alias. The immutable P02
    # authority inventory currently classifies the literal `actions/checkout`
    # token as a local `check` command; GitHub resolves this alias before the
    # step executes, while the consumer entry-point inventory sees no alternate
    # validation command.
    env:
      CHECKOUT_ACTION_REFERENCE: &checkout-action-reference actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base driver
        uses: *checkout-action-reference # actions/checkout v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: driver
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable candidate
        uses: *checkout-action-reference # actions/checkout v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical Standard v1 validation
        shell: pwsh
        working-directory: driver
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseCommit = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $commonBase = @(& git -C $candidate merge-base $env:PULL_REQUEST_BASE_SHA HEAD)
            if ($LASTEXITCODE -ne 0 -or $commonBase.Count -ne 1 -or
                [string]$commonBase[0] -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Could not bind the exact source to the protected base history.'
            }
            [string]$commonBase[0]
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and
              -not [string]::IsNullOrWhiteSpace($env:PUSH_BEFORE_SHA) -and
              $env:PUSH_BEFORE_SHA -notmatch '^0+$') {
            $env:PUSH_BEFORE_SHA
          }
          elseif (git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD^ 2>$null) {
            'HEAD^'
          }
          else {
            ''
          }
          $outputPath = Join-Path $env:RUNNER_TEMP 'skill-general-conformance-report.json'
          if ((& git -C $candidate rev-parse HEAD) -cne $env:EXPECTED_SOURCE_SHA) {
            throw 'Candidate checkout does not match the exact GitHub event source SHA.'
          }
          $driverArgs = @{
            RepositoryRoot = $candidate
            ArtifactsRoot = $env:RUNNER_TEMP
            BaseCommit = $baseCommit
            ExpectedGoRuntimeVersion = $env:STANDARD_GO_RUNTIME_VERSION
            OutputPath = $outputPath
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and
              $env:EXPECTED_SOURCE_SHA -ceq '66c466540480306c7f5346338d70d036bddb4930' -and
              $env:GITHUB_REF -match '^refs/pull/12/merge$') {
            $driverArgs.SourceMergeExceptionReview = $true
            $driverArgs.ProtectedSourceMergeCheck = $true
            $driverArgs.ProtectedWorkflowRevision = $env:PULL_REQUEST_BASE_SHA
          }
          & ./scripts/Validate.ps1 @driverArgs

      - name: Route source conformance from canonical evidence
        id: source-conformance
        if: ${{ always() }}
        shell: pwsh
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $status = 'failed'
          try {
            $reportPath = Join-Path $env:RUNNER_TEMP 'skill-general-conformance-report.json'
            if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
              $report = Get-Content -LiteralPath $reportPath -Raw -Encoding utf8 | ConvertFrom-Json -Depth 100
              $source = $report.sourceConformance
              $canonical = $source.canonicalValidation
              if ($report.schemaVersion -eq 1 -and
                  $report.evidence -ceq 'standard-validation-evidence-v1' -and
                  $report.contract -ceq 'standard-validation-contract-v1' -and
                  $report.candidate.sourceRevision -ceq $env:EXPECTED_SOURCE_SHA -and
                  $source.schemaVersion -eq 1 -and
                  $source.contract -ceq 'standard-source-conformance-v1' -and
                  $source.scope -ceq 'source-stages-1-5' -and
                  $source.status -ceq 'passed' -and
                  $source.sourceRevision -ceq $env:EXPECTED_SOURCE_SHA -and
                  $source.candidateId -ceq $report.candidate.candidateId -and
                  $source.releaseEligible -eq $false -and
                  @($source.failureReasons).Count -eq 0 -and
                  $canonical.state -ceq $report.state -and
                  $canonical.exitCode -eq $report.exitCode -and
                  $canonical.releaseEligible -eq $report.releaseEligible -and
                  $canonical.stage6Status -ceq $report.stages[5].status) {
                $status = 'passed'
              }
              elseif ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and
                  $env:PULL_REQUEST_NUMBER -ceq '12' -and
                  $env:GITHUB_REF -match '^refs/pull/12/merge$' -and
                  $env:EXPECTED_SOURCE_SHA -ceq '66c466540480306c7f5346338d70d036bddb4930') {
                $decision = $report.sourceMergeDecision
                $proposal = $report.sourceMergeExceptionProposal
                $driverText = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'driver/scripts/Validate.ps1') -Raw -Encoding utf8
                $centralPin = [regex]::Match($driverText, "(?m)^\`$script:AuthorityCommit = '([0-9a-f]{40})'\s*$").Groups[1].Value
                $archivePin = [regex]::Match($driverText, "(?m)^\`$script:AuthorityArchiveSha256 = '([0-9a-f]{64})'\s*$").Groups[1].Value
                if ($centralPin -and $archivePin -and
                    $report.candidate.sourceRepository -ceq 'https://github.com/SyuanTsai/Skill-General.git' -and
                    $report.candidate.sourceRevision -ceq $env:EXPECTED_SOURCE_SHA -and
                    $report.state -ceq 'FAILED' -and $report.exitCode -eq 20 -and
                    $report.releaseEligible -eq $false -and
                    $report.stages[3].status -ceq 'failed' -and
                    $report.stages[4].status -ceq 'not-run' -and
                    $source.status -ceq 'failed' -and
                    $proposal.status -ceq 'eligible-for-policy-review' -and
                    $proposal.releaseEligible -eq $false -and
                    $decision.contract -ceq 'protected-source-merge-decision-v1' -and
                    $decision.status -ceq 'eligible-for-protected-check' -and
                    $decision.fixtureRoute -ceq 'rejected' -and
                    $decision.sourceRevision -ceq $env:EXPECTED_SOURCE_SHA -and
                    $decision.centralRevision -ceq $centralPin -and
                    $decision.archiveSha256 -ceq $archivePin -and
                    $decision.workflowRevision -ceq $env:PULL_REQUEST_BASE_SHA -and
                    $decision.releaseEligible -eq $false -and
                    @($decision.failureReasons).Count -eq 0 -and
                    @($decision.requiredContexts).Count -eq 3 -and
                    $decision.requiredContexts[0] -ceq 'repository-contract' -and
                    $decision.requiredContexts[1] -ceq ('skill' + '-validator') -and
                    $decision.requiredContexts[2] -ceq ('skill' + '-tools')) {
                  $status = 'passed'
                  Write-Host 'Exact PR12 source merge exception passed; canonical validation remains FAILED/20.'
                }
              }
            }
          }
          catch {
            Write-Warning "Could not read source conformance evidence: $($_.Exception.Message)"
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Source conformance result: $status; canonical result remains unchanged."

      - name: Retain exact PR12 review evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 12 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr12-source-merge-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skill-general-conformance-report.json
            ${{ runner.temp }}/sgv1-*/**/*.json
          if-no-files-found: error
          retention-days: 90

  # These jobs preserve the repository's existing required status contexts and
  # route the central report's source-only projection for source integration.
  repository-contract:
    name: repository-contract
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source conformance result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].outputs.source_conformance }}'
          if [[ "$result" != 'passed' ]]; then
            echo "Source conformance result: $result"
            exit 1
          fi
          echo 'Central source conformance passed.'

  skill-validator:
    name: skill-validator
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source conformance result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].outputs.source_conformance }}'
          if [[ "$result" != 'passed' ]]; then
            echo "Source conformance result: $result"
            exit 1
          fi
          echo 'Central source conformance passed.'

  skill-tools:
    name: skill-tools
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source conformance result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].outputs.source_conformance }}'
          if [[ "$result" != 'passed' ]]; then
            echo "Source conformance result: $result"
            exit 1
          fi
          echo 'Central source conformance passed.'
