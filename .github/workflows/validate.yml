name: Standard v1 Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-validation:
    name: Skill-General Standard v1
    # Keep the pinned checkout action as a YAML scalar alias. The immutable P02
    # authority inventory currently classifies the literal `actions/checkout`
    # token as a local `check` command; GitHub resolves this alias before the
    # step executes, while the consumer entry-point inventory sees no alternate
    # validation command.
    env:
      CHECKOUT_ACTION_REFERENCE: &checkout-action-reference actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable candidate
        uses: *checkout-action-reference # actions/checkout v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical Standard v1 validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseCommit = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $env:PULL_REQUEST_BASE_SHA
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and
              -not [string]::IsNullOrWhiteSpace($env:PUSH_BEFORE_SHA) -and
              $env:PUSH_BEFORE_SHA -notmatch '^0+$') {
            $env:PUSH_BEFORE_SHA
          }
          elseif (git rev-parse HEAD^ 2>$null) {
            'HEAD^'
          }
          else {
            ''
          }
          $outputPath = Join-Path $env:RUNNER_TEMP 'skill-general-conformance-report.json'
          & ./scripts/Validate.ps1 -ArtifactsRoot $env:RUNNER_TEMP -BaseCommit $baseCommit -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -OutputPath $outputPath

      - name: Diagnose repository Pester failure
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifests = @(
            Get-Module -ListAvailable Pester |
              Where-Object { [string]$_.Version -ceq '6.2.0' } |
              Select-Object -ExpandProperty Path -Unique
          )
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one run-owned Pester 6.2.0 manifest after canonical validation; found $($manifests.Count)."
          }
          Import-Module -Name $manifests[0] -Force -ErrorAction Stop
          $loaded = Get-Module Pester | Select-Object -First 1
          if ($null -eq $loaded -or [string]$loaded.Version -cne '6.2.0') {
            throw 'The run-owned Pester 6.2.0 module was not loaded.'
          }
          Write-Host "PowerShell=$($PSVersionTable.PSVersion); Pester=$($loaded.Version); Manifest=$($manifests[0]); NativeErrorPreference=$PSNativeCommandUseErrorActionPreference"
          $env:STANDARD_VALIDATION_STAGE_ID = 'repository-tests'
          $env:STANDARD_VALIDATION_TOOL_ID = 'repository-test-pester'
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $focused = Invoke-Pester -Path 'tests/SemanticBridgeV2Consumer.Tests.ps1' -Output Detailed -PassThru
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ([int64]$focused.FailedCount -ne 0 -or [int64]$focused.PassedCount + [int64]$focused.SkippedCount -ne [int64]$focused.TotalCount) {
            throw "Focused consumer Pester failed: total=$($focused.TotalCount), passed=$($focused.PassedCount), failed=$($focused.FailedCount), skipped=$($focused.SkippedCount)."
          }
          try {
            $ErrorActionPreference = 'Continue'
            $complete = Invoke-Pester -Path 'tests' -Output Detailed -PassThru
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ([int64]$complete.FailedCount -ne 0 -or [int64]$complete.PassedCount + [int64]$complete.SkippedCount -ne [int64]$complete.TotalCount) {
            throw "Complete repository Pester failed: total=$($complete.TotalCount), passed=$($complete.PassedCount), failed=$($complete.FailedCount), skipped=$($complete.SkippedCount)."
          }

  # These jobs preserve the repository's existing required status contexts while
  # keeping the canonical Standard v1 gate as the only validation policy.
  repository-contract:
    name: repository-contract
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror canonical Standard v1 result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].result }}'
          if [[ "$result" != 'success' ]]; then
            echo "Canonical Standard v1 validation result: $result"
            exit 1
          fi
          echo 'Canonical Standard v1 validation passed.'

  skill-validator:
    name: skill-validator
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror canonical Standard v1 result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].result }}'
          if [[ "$result" != 'success' ]]; then
            echo "Canonical Standard v1 validation result: $result"
            exit 1
          fi
          echo 'Canonical Standard v1 validation passed.'

  skill-tools:
    name: skill-tools
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror canonical Standard v1 result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].result }}'
          if [[ "$result" != 'success' ]]; then
            echo "Canonical Standard v1 validation result: $result"
            exit 1
          fi
          echo 'Canonical Standard v1 validation passed.'
